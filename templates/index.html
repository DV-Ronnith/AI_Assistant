<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Smart Assistant</title>
  <meta name="description" content="AI Smart Assistant — ask questions and get intelligent responses powered by Google Gemini." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <!-- Logo -->
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="28" rx="8" fill="url(#logo-grad)" />
          <path d="M8 14.5l3.5 3.5L20 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs>
        </svg>
        <span class="logo-text">AI Smart Assistant</span>
      </div>
      <!-- New Chat -->
      <button id="btn-new-chat" class="btn-new-chat" title="New Chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Chat</span>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <div class="nav-section-label">Navigation</div>
      <button id="nav-home" class="nav-item active" data-page="home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M9 21V9h6v12"/></svg>
        Home
      </button>
      <button id="nav-history" class="nav-item" data-page="history">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Chat History
      </button>
    </nav>

    <!-- Conversation list -->
    <div class="sidebar-conversations">
      <div class="nav-section-label">Recent Chats</div>
      <ul id="conversation-list" class="conversation-list"></ul>
    </div>

    <!-- API Status -->
    <div class="sidebar-footer">
      <div id="api-status" class="api-status">
        <span class="status-dot"></span>
        <span class="status-text">Checking…</span>
      </div>
    </div>
  </aside>

  <!-- Mobile sidebar toggle -->
  <button id="btn-sidebar-toggle" class="btn-sidebar-toggle" aria-label="Toggle sidebar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- ===== MAIN ===== -->
  <main id="main" class="main">
    <!-- Chat messages area -->
    <div id="chat-area" class="chat-area">

      <!-- Welcome screen (shown when conversation is empty) -->
      <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="14" fill="url(#w-grad)" />
            <path d="M14 25l7 7L34 18" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="w-grad" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs>
          </svg>
        </div>
        <h1 class="welcome-heading">How can I help you today?</h1>
        <p class="welcome-subtitle">Ask questions, explore ideas, get explanations, or write code — I'm here to help.</p>
        <div class="suggestion-cards">
          <button class="suggestion-card" data-prompt="Explain a difficult concept in simple terms.">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span>Explain a difficult concept</span>
          </button>
          <button class="suggestion-card" data-prompt="Help me write a Python program that reads a CSV file and prints a summary of the data.">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>Help me write Python code</span>
          </button>
          <button class="suggestion-card" data-prompt="Summarize the key concepts of machine learning in a few paragraphs.">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Summarize a topic</span>
          </button>
          <button class="suggestion-card" data-prompt="Give me creative project ideas for a computer science student.">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>Give me ideas for a project</span>
          </button>
        </div>
      </div>

      <!-- Messages container (hidden until first message) -->
      <div id="messages" class="messages"></div>

      <!-- Typing indicator -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <div class="typing-avatar">
          <svg width="20" height="20" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="url(#t-grad)"/><path d="M8 14.5l3.5 3.5L20 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="t-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs></svg>
        </div>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- ===== INPUT AREA ===== -->
    <div class="input-area">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="Ask me anything…"
            rows="1"
            aria-label="Type your message"
          ></textarea>
          <button id="btn-send" class="btn-send" type="submit" title="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </form>
      <p class="disclaimer">AI can make mistakes. Verify important information.</p>
    </div>
  </main>

  <!-- Sidebar overlay for mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
